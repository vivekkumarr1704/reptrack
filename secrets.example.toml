# Copy these entries into Streamlit Community Cloud > App > Settings > Secrets.
# Do not commit a real secrets.toml file to GitHub.
SUPABASE_URL = "https://YOUR_PROJECT_ID.supabase.co"
SUPABASE_ANON_KEY = "YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY"

